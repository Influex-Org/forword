<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words | ForWord — Posts, Poems & Pieces</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-dark: #99662D;
            --gold-mid: #CB8E44;
            --gold-light: #DEAD74;
            --gold-gradient: linear-gradient(135deg, #99662D 0%, #CB8E44 35%, #DEAD74 65%, #CB8E44 100%);
            --gold-gradient-h: linear-gradient(90deg, #99662D 0%, #CB8E44 30%, #DEAD74 50%, #CB8E44 70%, #99662D 100%);
            --gold-text: linear-gradient(135deg, #DEAD74 0%, #CB8E44 50%, #DEAD74 100%);
            --bone: #E8E0D4;
            --dark-bg: #0D0D0D;
            --dark-section: #111111;
            --dark-card: #1A1A1A;
            --font-body: 'Montserrat', sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body { font-family: var(--font-body); background: var(--dark-bg); color: var(--bone); line-height: 1.7; overflow-x: hidden; }
        img { max-width: 100%; height: auto; display: block; }
        a { text-decoration: none; color: inherit; transition: all 0.3s ease; }

        .gold-text {
            background: var(--gold-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .gold-line { width: 60px; height: 2px; background: var(--gold-gradient-h); margin: 1.5rem auto; }

        /* Nav */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            padding: 1.25rem 3rem; display: flex; align-items: center; justify-content: space-between;
            background: rgba(13, 13, 13, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(203, 142, 68, 0.1);
        }
        .nav-logo { height: 40px; width: auto; }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; align-items: center; }
        .nav-links a {
            font-size: 0.7rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--bone); position: relative; padding-bottom: 4px;
        }
        .nav-links a::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1px;
            background: var(--gold-gradient-h); transition: width 0.3s ease;
        }
        .nav-links a:hover::after { width: 100%; }
        .nav-links a:hover { color: var(--gold-light); }
        .nav-links a.active { color: var(--gold-mid); }
        .nav-links a.active::after { width: 100%; }

        /* ============================================
           Hero Header
           ============================================ */
        .words-hero {
            position: relative;
            padding: 10rem 2rem 5rem;
            text-align: center;
            overflow: hidden;
        }

        .words-hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .words-hero-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.2;
        }

        .words-hero-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(13, 13, 13, 0.4) 0%,
                rgba(13, 13, 13, 0.6) 60%,
                rgba(13, 13, 13, 1) 100%
            );
        }

        .words-hero-content {
            position: relative;
            z-index: 1;
        }

        .words-hero-label {
            font-size: 0.7rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--gold-mid);
            margin-bottom: 1.5rem;
        }

        .words-hero h1 {
            font-size: clamp(2.2rem, 4.5vw, 3.5rem);
            font-weight: 300;
            line-height: 1.3;
            color: var(--bone);
            margin-bottom: 1rem;
        }

        .words-hero h1 em {
            font-style: italic;
        }

        .words-hero-sub {
            font-size: 1.05rem;
            font-weight: 300;
            color: rgba(232, 224, 212, 0.6);
            max-width: 550px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* ============================================
           Filter Bar
           ============================================ */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 2rem 2rem 0;
            background: var(--dark-bg);
        }

        .filter-btn {
            padding: 0.5rem 1.5rem;
            font-family: var(--font-body);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(232, 224, 212, 0.4);
            background: none;
            border: 1px solid rgba(203, 142, 68, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            color: var(--gold-mid);
            border-color: var(--gold-mid);
        }

        /* ============================================
           Post Sections — Stacked Cinematic
           ============================================ */
        #posts-container {
            display: flex;
            flex-direction: column;
        }

        .post-section {
            position: relative;
            padding: 5rem 2rem;
            overflow: hidden;
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-section:nth-child(odd) {
            background: var(--dark-bg);
        }

        .post-section:nth-child(even) {
            background: var(--dark-section);
        }

        /* Background image */
        .post-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .post-bg img,
        .post-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.15;
        }

        .post-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                rgba(13, 13, 13, 0.9) 0%,
                rgba(13, 13, 13, 0.5) 50%,
                rgba(13, 13, 13, 0.9) 100%
            );
        }

        /* Content */
        .post-content {
            position: relative;
            z-index: 1;
            max-width: 700px;
            text-align: center;
        }

        .post-type-badge {
            display: inline-block;
            padding: 0.3rem 1rem;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--dark-bg);
            background: var(--gold-gradient);
            margin-bottom: 1.5rem;
        }

        .post-date {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: rgba(232, 224, 212, 0.35);
            margin-bottom: 1rem;
        }

        .post-title {
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            font-weight: 400;
            color: var(--bone);
            line-height: 1.4;
            margin-bottom: 1rem;
        }

        .post-excerpt {
            font-size: 0.95rem;
            font-weight: 300;
            color: rgba(232, 224, 212, 0.6);
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .post-cta {
            display: inline-block;
            padding: 0.8rem 2.5rem;
            border: 1px solid var(--gold-mid);
            color: var(--gold-light);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .post-cta::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gold-gradient);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .post-cta:hover {
            color: var(--dark-bg);
            border-color: var(--gold-light);
        }

        .post-cta:hover::before {
            opacity: 1;
        }

        /* Empty state */
        .no-posts {
            text-align: center;
            padding: 5rem 2rem;
            color: rgba(232, 224, 212, 0.3);
            font-size: 1rem;
            font-weight: 300;
        }

        /* ============================================
           Single Post View (overlay)
           ============================================ */
        .post-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(13, 13, 13, 0.97);
            overflow-y: auto;
            padding: 6rem 2rem 4rem;
        }

        .post-overlay.open {
            display: block;
        }

        .post-overlay-close {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            z-index: 2001;
            background: none;
            border: 1px solid rgba(203, 142, 68, 0.3);
            color: var(--gold-mid);
            font-family: var(--font-body);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .post-overlay-close:hover {
            border-color: var(--gold-mid);
            color: var(--gold-light);
        }

        .post-overlay-inner {
            max-width: 700px;
            margin: 0 auto;
        }

        .post-overlay-type {
            display: inline-block;
            padding: 0.3rem 1rem;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--dark-bg);
            background: var(--gold-gradient);
            margin-bottom: 1.5rem;
        }

        .post-overlay-title {
            font-size: clamp(1.8rem, 3.5vw, 2.8rem);
            font-weight: 300;
            color: var(--bone);
            line-height: 1.3;
            margin-bottom: 0.75rem;
        }

        .post-overlay-date {
            font-size: 0.75rem;
            color: rgba(232, 224, 212, 0.35);
            letter-spacing: 0.1em;
            margin-bottom: 2.5rem;
        }

        .post-overlay-media {
            margin-bottom: 2.5rem;
        }

        .post-overlay-media iframe {
            width: 100%;
            border: none;
            border-radius: 4px;
        }

        .post-overlay-body {
            font-size: 1.05rem;
            font-weight: 300;
            color: rgba(232, 224, 212, 0.8);
            line-height: 2;
        }

        .post-overlay-body p {
            margin-bottom: 1.5rem;
        }

        /* Footer */
        footer { padding: 4rem 3rem 2rem; position: relative; overflow: hidden; }
        .footer-bg { position: absolute; inset: 0; z-index: 0; }
        .footer-bg img { width: 100%; height: 100%; object-fit: cover; opacity: 0.15; }
        .footer-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13,13,13,0.8) 0%, rgba(13,13,13,0.5) 50%, rgba(13,13,13,0.8) 100%); }
        .footer-inner { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; position: relative; z-index: 1; }
        .footer-logo { height: 35px; width: auto; opacity: 0.7; }
        .footer-social-icons { display: flex; gap: 1rem; align-items: center; }
        .footer-social-icon { width: 40px; height: 40px; border: 1px solid rgba(203,142,68,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        .footer-social-icon:hover { border-color: var(--gold-mid); background: rgba(203,142,68,0.1); transform: translateY(-2px); }
        .footer-social-icon svg { width: 16px; height: 16px; fill: var(--gold-mid); }
        .footer-social-icon:hover svg { fill: var(--gold-light); }
        .footer-bottom { text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(203,142,68,0.08); position: relative; z-index: 1; }
        .footer-bottom p { font-size: 0.65rem; letter-spacing: 0.15em; color: rgba(232,224,212,0.2); }

        /* Responsive */
        @media (max-width: 768px) {
            nav { padding: 1rem 1.5rem; }
            .nav-links { display: none; }
            .filter-bar { flex-wrap: wrap; }
        }
    </style>
</head>

    <script>
        let allPosts = [];
        let activeFilter = 'all';

        // Fetch and render posts
        async function loadPosts() {
            const res = await fetch('/api/posts');
            allPosts = await res.json();
            renderPosts();
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            const filtered = activeFilter === 'all'
                ? allPosts.filter(p => p.published)
                : allPosts.filter(p => p.published && p.type === activeFilter);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-posts">No posts yet. Check back soon.</div>';
                return;
            }

            container.innerHTML = filtered.map((post, i) => {
                const typeLabel = post.type.charAt(0).toUpperCase() + post.type.slice(1);
                const dateFormatted = new Date(post.date + 'T00:00:00').toLocaleDateString('en-US', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });
                const bgMedia = post.featuredImage
                    ? `<img src="${post.featuredImage}" alt="" loading="lazy">`
                    : '';

                return `
                    <section class="post-section">
                        <div class="post-bg">${bgMedia}</div>
                        <div class="post-content">
                            <span class="post-type-badge">${typeLabel}</span>
                            <p class="post-date">${dateFormatted}</p>
                            <h2 class="post-title">${post.title}</h2>
                            <p class="post-excerpt">${post.excerpt}</p>
                            <a href="#" class="post-cta" onclick="openPost('${post.slug}'); return false;">
                                ${post.type === 'video' ? 'Watch' : post.type === 'audio' ? 'Listen' : 'Read More'}
                            </a>
                        </div>
                    </section>
                `;
            }).join('');
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                renderPosts();
            });
        });

        // Open single post
        async function openPost(slug) {
            const post = allPosts.find(p => p.slug === slug);
            if (!post) return;

            const dateFormatted = new Date(post.date + 'T00:00:00').toLocaleDateString('en-US', {
                year: 'numeric', month: 'long', day: 'numeric'
            });
            const typeLabel = post.type.charAt(0).toUpperCase() + post.type.slice(1);

            let media = '';
            if (post.type === 'video' && post.videoUrl) {
                media = `<div class="post-overlay-media"><iframe src="${post.videoUrl}" height="400" allowfullscreen></iframe></div>`;
            } else if (post.type === 'audio' && post.audioUrl) {
                media = `<div class="post-overlay-media"><iframe src="${post.audioUrl}" height="166"></iframe></div>`;
            }

            const bodyHtml = post.body.split('\n\n').map(p => `<p>${p}</p>`).join('');

            document.getElementById('postOverlayContent').innerHTML = `
                <span class="post-overlay-type">${typeLabel}</span>
                <h1 class="post-overlay-title">${post.title}</h1>
                <p class="post-overlay-date">${dateFormatted}</p>
                ${media}
                <div class="post-overlay-body">${bodyHtml}</div>
            `;

            document.getElementById('postOverlay').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closePost() {
            document.getElementById('postOverlay').classList.remove('open');
            document.body.style.overflow = '';
        }

        // Close on Escape
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closePost();
        });

        // Init
        loadPosts();
    </script>
